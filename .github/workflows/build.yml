name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            build-tools;37.0.0
      - name: Make local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Assemble
        env:
          APP_BUILD_CHANNEL: stable
        run: ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache
      - name: Upload APK
        if: ${{ !cancelled() && !failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: water-resistance-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk