name: Release

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      tag_prefix:
        required: true
        type: string
      prerelease:
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            build-tools;37.0.0
      - name: Make local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Release signing key
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/upload-keystore.jks
          chmod 600 keystore/upload-keystore.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=upload
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
      - name: Build signed release APK
        env:
          APP_BUILD_CHANNEL: ${{ inputs.channel || 'stable' }}
        run: ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache
      - name: Sign APK
        id: sign
        run: |
          export PATH=$ANDROID_SDK_ROOT/build-tools/37.0.0:$PATH
          APK=app/build/outputs/apk/release/app-release.apk
          SIGNED=app/build/outputs/apk/release/app-release-signed.apk
          jarsigner -verbose -keystore keystore/upload-keystore.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keypass "${{ secrets.KEY_PASSWORD }}" -signedjar "$SIGNED" "$APK" upload
          rm -f "$APK"
          zipalign -f 4 "$SIGNED" "$APK"
          rm -f "$SIGNED"
          echo "apk=$APK" >> $GITHUB_OUTPUT
      - name: Version info
        id: version
        run: |
          TAG_DATE=$(date +%Y%m%d)
          APK_PATH=app/build/outputs/apk/release/app-release.apk
          echo "apk=$APK_PATH" >> $GITHUB_OUTPUT
          echo "name=water-resistance-${{ github.ref_name }}-$TAG_DATE.apk" >> $GITHUB_OUTPUT
          echo "tag=${{ inputs.tag_prefix || github.ref_name }}-$TAG_DATE" >> $GITHUB_OUTPUT
          echo "release_name=Water Resistance Tester ${{ github.ref_name }} ($TAG_DATE)" >> $GITHUB_OUTPUT
          echo "release_body<<EOF" >> $GITHUB_OUTPUT
          echo "Auto-built from \`${{ github.ref_name }}\` on $TAG_DATE." >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "Build: \`${{ github.sha }}\`" >> $GITHUB_OUTPUT
          echo "Channel: ${{ inputs.channel || 'stable' }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          body: ${{ steps.version.outputs.release_body }}
          files: ${{ steps.version.outputs.apk }}
          make_latest: ${{ inputs.channel != 'nightly' }}
          prerelease: ${{ inputs.prerelease }}
