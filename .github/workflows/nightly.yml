name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC daily
  push:
    branches: [nightly]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android/setup-android@v5
        with:
          cmdline-tools-version: 16.0
          packages: |
            platforms;android-37
            build-tools;37.0.0
      - name: Make local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Assemble debug
        env:
          APP_BUILD_CHANNEL: nightly
        run: ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache
      - name: Upload nightly debug APK
        if: ${{ !cancelled() && !failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: water-resistance-nightly-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'schedule'
    uses: ./.github/workflows/release.yml
    secrets: inherit
    permissions:
      contents: write
      actions: read
    with:
      channel: nightly
      tag_prefix: nightly